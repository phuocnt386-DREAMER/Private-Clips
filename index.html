<script>
(() => {
'use strict';

const DEFAULT_SHEET_ID = '1p3Bs-_oOuQIQQm__4R1flli1BuFGW_JbJ-P8-z8vRR4';
const LEGACY_BROKEN_ID = '1IKTN4-IQVx8Pg239GnR6b4oF4D2LPXXg';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function readWinStore() {
  try {
    if (window.name && window.name.startsWith('PC_TIKTOK:')) {
      return JSON.parse(window.name.slice(10)) || {};
    }
  } catch (e) {}
  return {};
}
function writeWinStore(obj) {
  try { window.name = 'PC_TIKTOK:' + JSON.stringify(obj); } catch (e) {}
}
const lsRaw = (k) => {
  try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {}
  const ws = readWinStore();
  return ws[k] !== undefined ? ws[k] : null;
};
const lsSetRaw = (k, v) => {
  try { localStorage.setItem(k, v); } catch (e) {}
  const ws = readWinStore(); ws[k] = v; writeWinStore(ws);
};
const load = (k, d) => { try { const v = JSON.parse(lsRaw(k)); return v ?? d; } catch (e) { return d; } };
const save = (k, v) => lsSetRaw(k, JSON.stringify(v));
const icons = () => { try { window.lucide && lucide.createIcons(); } catch (e) {} };

const savedSheet = lsRaw('pc_sheet');
const initialSheet = (!savedSheet || savedSheet === LEGACY_BROKEN_ID) ? DEFAULT_SHEET_ID : savedSheet;
if (savedSheet === LEGACY_BROKEN_ID) lsSetRaw('pc_sheet', DEFAULT_SHEET_ID);

const S = {
  accounts: [],
  clips: [],
  feedClips: [],
  activeClipUid: '',
  activeProfileKey: '',
  profilePlaylist: '',
  feedPlaylist: null,
  tab: 'foryou',
  tagFilter: '',
  searchQuery: '',
  cleanUi: false,
  following: load('pc_following', []),
  likedClips: load('pc_liked_clips', []),
  sheet: initialSheet
};

let tt;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.opacity = 1;
  t.style.transform = 'translate(-50%, 0)';
  clearTimeout(tt);
  tt = setTimeout(() => {
    t.style.opacity = 0;
    t.style.transform = 'translate(-50%, 24px)';
  }, 2600);
}

function fid(u) {
  if (!u) return '';
  u = String(u).trim();
  const m = u.match(/\/d\/([\w-]{10,})/) || u.match(/[?&]id=([\w-]{10,})/) || u.match(/\/folders\/([\w-]{10,})/);
  if (m) return m[1];
  return /^[\w-]{15,}$/.test(u) ? u : '';
}
const thumb = (id, w) => id ? `https://lh3.googleusercontent.com/d/${id}=w${w}` : '';
const thumbAlt = (id, w) => id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${w}` : '';
function imgUrl(u, w) {
  u = String(u || '').trim();
  if (!u) return '';
  if (/drive\.google\.com|docs\.google\.com/.test(u)) return thumb(fid(u), w);
  return /^https?:\/\//.test(u) ? u : '';
}

function makeAvatarSvg(name) {
  let hash = 0;
  for (const ch of String(name || 'A')) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  const hue = 250 + (hash % 60);
  const letter = esc((String(name || 'A').replace(/^@+/, '').trim()[0] || 'A').toUpperCase());
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${hue},75%,45%)'/><stop offset='1' stop-color='#080910'/></linearGradient></defs><rect width='128' height='128' fill='url(#a)'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='54' fill='#fff'>${letter}</text></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

window.imgFail = (el) => {
  const list = (el.dataset.fb || '').split('|').filter(Boolean);
  if (list.length) {
    el.dataset.fb = list.slice(1).join('|');
    el.src = list[0];
  } else if (el.dataset.gen) {
    el.onerror = null;
    el.src = el.dataset.gen;
  }
};

function renderImgTag(src, fbs, genSrc, cls, alt) {
  const first = src || fbs.find(Boolean) || genSrc;
  const rest = (src ? fbs : fbs.slice(1)).filter(Boolean).join('|');
  return `<img src="${esc(first)}" data-fb="${esc(rest)}" data-gen="${esc(genSrc)}" onerror="imgFail(this)" alt="${esc(alt)}" class="${cls}" decoding="async" referrerpolicy="no-referrer">`;
}

function slugTag(raw) {
  return String(raw || '').trim().replace(/^#+/, '').replace(/\s+/g, '');
}

const MOCK = [
  ['@kênh_sáng_tạo', 'trend, ngắn_gọn', '20/11/2026', 'Series Đi Đà Lạt', '', '', 'MOCK_clip_101', 'Tập 1: Đêm sương mù', 'Tổng hợp các phân cảnh ngắn dọc màn hình phong cách TikTok.'],
  ['@kênh_sáng_tạo', '', '21/11/2026', 'Series Đi Đà Lạt', '', '', 'MOCK_clip_102', 'Tập 2: Đồi chè sáng sớm', ''],
  ['@kênh_sáng_tạo', '', '21/11/2026', 'Góc Review', '', '', 'MOCK_clip_103', 'Mở hộp phụ kiện bàn làm việc', ''],
  ['@nhịp_sống_đêm', 'đêm_khuya, chill', '19/11/2026', 'Sài Gòn 2AM', '', '', 'MOCK_clip_201', 'Video 01', 'Không gian ánh đèn neon và nhịp điệu chậm rãi.'],
  ['@phiêu_lưu_ký', 'khám_phá, dọc_916', '18/11/2026', '', '', '', 'MOCK_clip_301', 'Clip lẻ 01', 'Hành trình qua những góc phố nhỏ.']
];

function parseRows(rows) {
  const accMap = new Map();
  const headRe = /^(tên phim|ten phim|name|title|phim|account|kênh|kenh)$/i;
  let seq = 0;

  rows.forEach(r => {
    const g = (i) => (r[i] === null || r[i] === undefined) ? '' : String(r[i]).trim();
    const rawName = g(0);
    if (!rawName || headRe.test(rawName)) return;
    const handle = rawName.startsWith('@') ? rawName : '@' + rawName;
    const key = handle.toLowerCase();

    let acc = accMap.get(key);
    if (!acc) {
      acc = {
        key,
        handle,
        displayName: rawName.replace(/^@+/, ''),
        tags: [],
        playlists: [],
        avatar: '',
        cover: '',
        desc: '',
        clips: [],
        order: seq++
      };
      accMap.set(key, acc);
    }

    g(1).split(/[,;|\/#]/).map(slugTag).filter(Boolean).forEach(tg => {
      if (!acc.tags.some(x => x.toLowerCase() === tg.toLowerCase())) acc.tags.push(tg);
    });

    const playlistName = g(3);
    if (playlistName && !acc.playlists.some(p => p.name.toLowerCase() === playlistName.toLowerCase())) {
      acc.playlists.push({ name: playlistName, count: 0 });
    }

    if (!acc.avatar && g(4)) acc.avatar = imgUrl(g(4), 256);
    if (!acc.cover && g(5)) acc.cover = imgUrl(g(5), 720);
    if (!acc.desc && g(8)) acc.desc = g(8);

    const driveId = fid(g(6));
    if (driveId) {
      const matchedPl = acc.playlists.find(p => p.name.toLowerCase() === playlistName.toLowerCase());
      if (matchedPl) matchedPl.count++;

      acc.clips.push({
        uid: `${key}__${acc.clips.length}__${driveId}`,
        accountKey: key,
        handle,
        playlist: matchedPl ? matchedPl.name : '',
        caption: g(7) || `Video ${acc.clips.length + 1}`,
        desc: g(8) || acc.desc,
        tags: [...acc.tags],
        driveId,
        seq: seq++
      });
    }
  });

  const accounts = [...accMap.values()].filter(a => a.clips.length > 0);
  accounts.forEach(acc => {
    acc.playlists = acc.playlists.filter(p => p.count > 0);
    const firstId = acc.clips[0].driveId;
    acc.avatarGen = makeAvatarSvg(acc.handle);
    acc.avatarFb = [thumb(firstId, 256), thumbAlt(firstId, 256)];
    acc.coverGen = makeAvatarSvg(acc.displayName);
    acc.coverFb = [thumb(firstId, 720), thumbAlt(firstId, 720)];

    acc.clips.forEach((c, idx) => {
      c.poster = acc.cover || acc.avatar || '';
      c.posterFb = [thumb(c.driveId, 720), thumbAlt(c.driveId, 720), thumb(c.driveId, 480)];
      c.posterGen = acc.coverGen;
      c.avatar = acc.avatar;
      c.avatarFb = acc.avatarFb;
      c.avatarGen = acc.avatarGen;
      c.indexInAccount = idx;
      c.totalInAccount = acc.clips.length;

      if (c.playlist) {
        const plClips = acc.clips.filter(x => x.playlist === c.playlist);
        c.indexInPlaylist = plClips.findIndex(x => x.uid === c.uid);
        c.totalInPlaylist = plClips.length;
      }
    });
  });

  const allClips = accounts.flatMap(a => a.clips);
  return { accounts, allClips };
}

function rowsFromJson(json) {
  if (json.status === 'error') throw new Error(json.errors?.[0]?.detailed_message || json.errors?.[0]?.message || 'Lỗi Sheet');
  return (json.table?.rows || []).map(row => Array.from({ length: 9 }, (_, i) => { const c = row.c?.[i]; return c ? (c.v ?? c.f ?? '') : ''; }));
}

function viaFetch(id) {
  return fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json`).then(async res => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
    if (a < 0 || b < 0) throw new Error('Phản hồi không phải dữ liệu Sheet');
    return rowsFromJson(JSON.parse(txt.slice(a, b + 1)));
  });
}

function viaScript(id) {
  return new Promise((resolve, reject) => {
    const cb = '__pcCb' + Date.now(), s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); reject(new Error('Hết thời gian chờ Google Sheet')); }, 10000);
    window[cb] = (json) => { done(); try { resolve(rowsFromJson(json)); } catch (e) { reject(e); } };
    s.onerror = () => { done(); reject(new Error('Không tải được script từ Google')); };
    s.src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
    document.head.appendChild(s);
  });
}

async function fetchSheet(id) {
  const errs = [];
  for (const [name, fn] of [['fetch', viaFetch], ['script', viaScript]]) {
    try { return await fn(id); } catch (e) { errs.push(name + ': ' + e.message); }
  }
  throw new Error(errs.join(' | '));
}

async function loadData(silentErr = false) {
  const sid = fid(S.sheet) || (S.sheet && /^[\w-]{20,}$/.test(S.sheet) ? S.sheet : '');
  let parsed;
  if (!sid) {
    parsed = parseRows(MOCK);
    if (!silentErr) toast('Đang dùng dữ liệu mẫu');
  } else {
    try {
      const rows = await fetchSheet(sid);
      parsed = parseRows(rows);
      if (!parsed.allClips.length) throw new Error('Sheet chưa có video nào');
    } catch (e) {
      parsed = parseRows(MOCK);
      if (!silentErr) toast('Lỗi tải Sheet, đang dùng dữ liệu mẫu');
    }
  }
  S.accounts = parsed.accounts;
  S.clips = parsed.allClips;
  rebuildFeed(true);
}

}

function mountPlayerAt(uid) {
  S.activeClipUid = uid;
  const clip = S.feedClips.find(c => c.uid === uid) || S.clips.find(c => c.uid === uid);
  if (!clip) return;

  document.querySelectorAll('.feed-player-host').forEach(host => {
    if (host.dataset.uid === uid) {
      if (clip.driveId.startsWith('MOCK')) {
        host.innerHTML = `<div class="flex h-full w-full flex-col items-center justify-center gap-2 bg-black/80 p-6 text-center"><i data-lucide="clapperboard" class="h-10 w-10 text-cyanAccent"></i><p class="text-sm font-bold">${esc(clip.handle)} – ${esc(clip.caption)}</p><p class="text-xs text-white/60">Video mẫu (gắn Google Sheet để phát video Drive thật)</p></div>`;
        icons();
      } else if (!host.querySelector('iframe')) {
        const src = buildEmbedSrc(clip);
        host.innerHTML = `<iframe src="${esc(src)}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      }
    } else if (host.innerHTML) {
      host.innerHTML = '';
    }
  });
}

let snapObserver;
function setupFeedObserver() {
  if (snapObserver) snapObserver.disconnect();
  const container = $('#feedScroll');
  snapObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && entry.intersectionRatio >= 0.65) {
        const uid = entry.target.dataset.uid;
        if (uid && uid !== S.activeClipUid) {
          mountPlayerAt(uid);
        }
      }
    });
  }, { root: container, threshold: [0.65] });

  container.querySelectorAll('.feed-slide').forEach(slide => snapObserver.observe(slide));
}

function updateTopBadge() {
  const txtEl = $('#topModeText');
  const clearBtn = $('#btnClearFeedFilter');
  let label = 'Dành cho bạn';
  let hasFilter = false;

  if (S.tab === 'discover') {
    label = 'Khám phá';
  } else if (S.feedPlaylist) {
    label = `${S.feedPlaylist.name}`;
    hasFilter = true;
  } else if (S.tab === 'following') {
    label = S.tagFilter ? `Đang follow • #${S.tagFilter}` : 'Đang follow';
    hasFilter = Boolean(S.tagFilter);
  } else {
    label = S.tagFilter ? `Dành cho bạn • #${S.tagFilter}` : 'Dành cho bạn';
    hasFilter = Boolean(S.tagFilter);
  }

  txtEl.textContent = label;
  clearBtn.classList.toggle('hidden', !hasFilter || S.tab === 'discover');
}

function rebuildFeed(shuffle = false, startUid = '') {
  let pool = [...S.clips];

  if (S.feedPlaylist) {
    pool = pool.filter(c => c.accountKey === S.feedPlaylist.accountKey && c.playlist === S.feedPlaylist.name);
  } else {
    if (S.tab === 'following') {
      pool = pool.filter(c => isFollowing(c.accountKey));
    }
    if (S.tagFilter) {
      const tf = S.tagFilter.toLowerCase();
      pool = pool.filter(c => c.tags.some(t => t.toLowerCase() === tf));
    }
    if (shuffle && S.tab === 'foryou' && !S.tagFilter) {
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
    }
  }

  updateTopBadge();
  S.feedClips = pool;
  const scroller = $('#feedScroll');

  if (!pool.length) {
    const emptyMsg = S.tab === 'following'
      ? 'Bạn chưa follow Account nào. Bấm + trên avatar ở feed để follow.'
      : 'Không có video nào khớp với bộ lọc hiện tại.';
    scroller.innerHTML = `<div class="flex h-dvh flex-col items-center justify-center gap-3 px-6 text-center">
      <p class="text-sm text-white/60">${esc(emptyMsg)}</p>
      ${(S.tagFilter || S.feedPlaylist) ? `<button type="button" id="btnClearTag" class="violet-grad rounded-full px-5 py-2 text-xs font-bold">Quay lại tất cả</button>` : ''}
    </div>`;
    const cBtn = $('#btnClearTag');
    if (cBtn) cBtn.onclick = () => { S.tagFilter = ''; S.feedPlaylist = null; rebuildFeed(false); };
    icons();
    return;
  }

  scroller.innerHTML = pool.map(renderSlideHTML).join('');
  icons();
  setupFeedObserver();

  let targetIdx = 0;
  if (startUid) {
    const found = pool.findIndex(c => c.uid === startUid);
    if (found >= 0) targetIdx = found;
  }
  const targetSlide = scroller.children[targetIdx];
  if (targetSlide) {
    scroller.scrollTop = targetSlide.offsetTop;
    mountPlayerAt(pool[targetIdx].uid);
  }
}

  document.querySelectorAll('.nav-tab').forEach(btn => {
    btn.classList.toggle('tab-active', btn.dataset.tab === tabName);
  });

  $('#viewFeed').classList.toggle('hidden', tabName !== 'foryou' && tabName !== 'following');
  $('#viewProfile').classList.add('hidden');
  $('#viewDiscover').classList.toggle('hidden', tabName !== 'discover');

  if (tabName === 'foryou' || tabName === 'following') {
    rebuildFeed(false);
  } else if (tabName === 'discover') {
    updateTopBadge();
    stopAllFeedPlayers();
    renderDiscover();
  }
  icons();
}

        </div>
        <div class="min-w-0 flex-1">
          <h3 class="truncate text-sm font-extrabold text-white">${esc(acc.handle)}</h3>
          <p class="truncate text-[11px] text-cyanAccent">${acc.clips.length} video${acc.playlists.length ? ` • ${acc.playlists.length} playlist` : ''}</p>
          ${acc.tags.length ? `<p class="truncate text-[10px] text-white/50">${acc.tags.slice(0, 3).map(t => '#' + t).join(' ')}</p>` : ''}
        </div>
      </article>`).join('')
    : '<p class="col-span-full py-10 text-center text-xs text-white/50">Không tìm thấy Account phù hợp.</p>';

  icons();
}

/* ---------- Global Click & Keyboard Navigation ---------- */
document.addEventListener('click', (ev) => {
  const t = ev.target;

  const tabBtn = t.closest('[data-tab]');
  if (tabBtn) return switchTab(tabBtn.dataset.tab);

  const followBtn = t.closest('[data-follow-acc]');
  if (followBtn) {
    ev.stopPropagation();
    return toggleFollow(followBtn.dataset.followAcc);
  }

  const likeBtn = t.closest('[data-like-clip]');
  if (likeBtn) {
    ev.stopPropagation();
    return toggleLikeClip(likeBtn.dataset.likeClip);
  }

  const profTrigger = t.closest('[data-open-profile]');
  if (profTrigger) {
    ev.stopPropagation();
    return openProfile(profTrigger.dataset.openProfile);
  }

  const plSelectBtn = t.closest('[data-select-playlist]');
  if (plSelectBtn) {
    const acc = S.accounts.find(a => a.key === S.activeProfileKey);
    if (!acc) return;
    S.profilePlaylist = plSelectBtn.dataset.selectPlaylist;
    renderProfilePlaylists(acc);
    renderProfileGrid(acc);
    icons();
    return;
  }

  const playPlTrigger = t.closest('[data-play-playlist]');
  if (playPlTrigger) {
    ev.stopPropagation();
    const [accKey, plName] = playPlTrigger.dataset.playPlaylist.split('||');
    if (accKey && plName) {
      launchPlaylistFeed(accKey, plName, S.activeClipUid);
      toast(`Danh sách phát: ${plName}`);
    }
    return;
  }

  const tagTrigger = t.closest('[data-filter-tag]');
  if (tagTrigger) {
    ev.stopPropagation();
    const clickedTag = tagTrigger.dataset.filterTag;
    S.feedPlaylist = null;
    S.tagFilter = (S.tagFilter.toLowerCase() === clickedTag.toLowerCase()) ? '' : clickedTag;
    if (S.tab === 'discover') {
      renderDiscover();
      if (S.tagFilter) toast(`Đang lọc #${S.tagFilter}`);
    } else {
      switchTab(S.tab === 'following' ? 'following' : 'foryou');
      toast(S.tagFilter ? `Đang xem #${S.tagFilter}` : 'Đã bỏ lọc hashtag');
    }
    return;
  }

  const playClipBtn = t.closest('[data-play-clip]');
  if (playClipBtn) {
    const uid = playClipBtn.dataset.playClip;
    if (S.activeProfileKey && S.profilePlaylist) {
      launchPlaylistFeed(S.activeProfileKey, S.profilePlaylist, uid);
    } else {
      S.feedPlaylist = null;
      S.tab = 'foryou';
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.toggle('tab-active', b.dataset.tab === 'foryou'));
      $('#viewProfile').classList.add('hidden');
      $('#viewDiscover').classList.add('hidden');
      $('#viewFeed').classList.remove('hidden');
      rebuildFeed(false, uid);
    }
  }
});

$('#btnPlayAllPlaylist').onclick = () => {
  if (S.activeProfileKey && S.profilePlaylist) {
    launchPlaylistFeed(S.activeProfileKey, S.profilePlaylist, '');
  }
};

$('#btnClearFeedFilter').onclick = () => {
  S.tagFilter = '';
  S.feedPlaylist = null;
  rebuildFeed(false);
  toast('Đã quay về Feed chung');
};

document.addEventListener('keydown', (e) => {
  if (!$('#cfgModal').classList.contains('hidden')) {
    if (e.key === 'Escape') closeCfg();
    return;
  }
  if ($('#viewFeed').classList.contains('hidden')) return;
  const scroller = $('#feedScroll');
  const h = scroller.clientHeight || window.innerHeight;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    scroller.scrollBy({ top: h, behavior: 'smooth' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    scroller.scrollBy({ top: -h, behavior: 'smooth' });
  }
});

$('#btnBackFromProfile').onclick = () => {
  switchTab(S.tab === 'following' ? 'following' : 'foryou');
};

$('#btnProfileFollow').onclick = () => {
  if (S.activeProfileKey) toggleFollow(S.activeProfileKey);
};

$('#btnClearUi').onclick = () => {
  S.cleanUi = !S.cleanUi;
  document.body.classList.toggle('clean-mode', S.cleanUi);
  const btn = $('#btnClearUi');
  btn.classList.toggle('violet-grad', S.cleanUi);
  btn.classList.toggle('glass', !S.cleanUi);
  btn.classList.toggle('text-white', S.cleanUi);
  btn.classList.toggle('text-purple-200', !S.cleanUi);
  btn.innerHTML = `<i data-lucide="${S.cleanUi ? 'eye-off' : 'eye'}" class="h-4 w-4"></i>`;
  icons();
  toast(S.cleanUi ? 'Đã ẩn chữ trên video' : 'Đã hiện chữ trên video');
};

const dInput = $('#discoverInput');
const dClear = $('#discoverClear');
dInput.addEventListener('input', () => {
  S.searchQuery = dInput.value;
  dClear.classList.toggle('hidden', !S.searchQuery.trim());
  renderDiscover();
});
dClear.onclick = () => {
  dInput.value = '';
  S.searchQuery = '';
  dClear.classList.add('hidden');
  renderDiscover();
};

function openCfg() {
  $('#cfgSheet').value = S.sheet;
  const m = $('#cfgModal');
  m.classList.remove('hidden');
  m.classList.add('flex');
  icons();
}
function closeCfg() {
  const m = $('#cfgModal');
  m.classList.add('hidden');
  m.classList.remove('flex');
}
$('#btnOpenCfg').onclick = openCfg;
$('#cfgClose').onclick = closeCfg;
$('#cfgModal').addEventListener('click', (e) => { if (e.target.id === 'cfgModal') closeCfg(); });

$('#cfgSave').onclick = () => {
  const v = $('#cfgSheet').value.trim();
  S.sheet = v;
  lsSetRaw('pc_sheet', v);
  S.feedPlaylist = null;
  closeCfg();
  loadData(false);
};
$('#cfgMock').onclick = () => {
  S.sheet = '';
  lsSetRaw('pc_sheet', '');
  S.feedPlaylist = null;
  closeCfg();
  loadData(false);
};

icons();
loadData(true);
})();
</script>
</body>
</html>
